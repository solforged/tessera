      An inline link can display different wording without changing its target:
      `[[Target|alias]]`. While `[[` completion is open, type `|` to accept the
      highlighted target and begin the alias inside the paired `]]`; if no match or
      Create atom is highlighted, the typed target stays as written without creating a
      page. Alias text never filters or reopens completion. To add an alias to an
      existing link, place the caret just before `]]` and type `|alias`. Enter and Tab
      still accept a completion and continue after the link; Escape still dismisses it
      without accepting a target.
    context:
      heading: "## Aliases"
      before: |-
        Add alias, under Description… in the page menu and in the palette, adds the
        Aliases field after the gloss and starts a new value with keyboard focus, ready
        for the first typed character. `[[` completion and Find name the alias a result
        was found through as `via Tully`, in the faint apparatus at the row's end.
      after: |-
        At a note's top level, populated Aliases entries, however many the note holds,
        stay out of Outline and Read while the header's ALSO line presents them.
        Clicking or tapping that line, or activating it with the keyboard, reveals the
        field and edits its first value. Add alias also reveals it before starting the
        new value. Zoomed outlines and sources keep ordinary field presentation.
  answer:
