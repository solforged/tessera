      Below the mode tabs, `Find in Concepts…` (using the kind's plural) matches plain
      words against title or Gloss. `links:`, `from:` and `cites:` resolve titles and
      aliases; `cites:` also resolves source sigla and citation keys. Quote a
      multiword value, for example `links:"Three generations of a dynasty"`. Names
      complete after the colon. Enter, a closing quote or leaving the input resolves
      each term to a removable table-style chip; unresolved names show
      `No note named “X”`. All terms and field filters intersect. `cites:` includes
      passage citations of any of the source's snapshots and any reference to its
      source page.
    context:
      heading: "## Finding aid"
      before: |-
        Only populated jump letters appear, and only with Letter grouping. The strip
        stays on one line, using compact targets on desktop. On the touch cover it
        becomes a vertical rail at the right edge, with touch-sized letter targets and
        compact inline initials in the list. The rail scrolls when its letters exceed
        the available height; it never occupies a dock above bottom navigation. Sort as,
        diacritic folding, `#` last and alias cross-references retain their filing
        rules. A title opens its note. The finding aid fills the pane to the right when
        one exists. Otherwise it uses its own pane. ⌘-click or ⌘Enter opens beside
        (Ctrl-click or Ctrl+Enter off Mac). A coarse pointer at least 900 px wide opens
        beside by default.
      after: |-
        The names that complete after a colon open as a list under the field. Arrows
        highlight, Enter picks the highlighted name, and Escape closes the list for the
