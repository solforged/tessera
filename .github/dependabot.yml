# Tessera dependency updates. Bun >=1.1.39 and Cargo are both supported
# ecosystems; the web editor lives in web/ with bun.lock. Dependabot's own
# "Bump x from 1 to 2" subjects already follow the commit convention.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # wasm-bindgen-cli must match the crate version pinned by mise; keep
    # those two moving together by hand. caseless stays pinned so stored
    # title_key values never drift across Unicode case-folding tables.
    ignore:
      - dependency-name: "wasm-bindgen"
      - dependency-name: "caseless"

  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
