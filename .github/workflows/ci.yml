name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      - name: Format and Clippy
        run: mise run lint

      - name: Test
        run: mise run test

  browser:
    name: browser wasm build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      - name: Clippy for the browser demo
        run: mise run demo:lint

      - name: Browser tests for the demo engine
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" mise run demo:test

  bench:
    name: backend correctness and scaling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      # Absolute budgets are for named devices; shared runners report them
      # but gate only on correctness and the no-per-row-work checks.
      - name: Run 50k correctness and scaling
        run: mise run bench --root "${{ runner.temp }}/tessera-bench" --sizes 50000 --fail-on scaling

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      - name: Typecheck and build
        run: mise run web:build

  android:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      # Builds the pages first: the app's Tauri context embeds them. The
      # runner's Android SDK supplies the NDK.
      - name: Clippy for Android
        run: mise run android:lint

  embedded:
    name: embedded release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      - name: Build web
        run: mise run web:build

      - name: Build embedded binary
        run: cargo build --locked -p tessera-cli --features embed-web

      - name: Clippy with embedded assets
        run: mise run cli:lint

      - name: Test embedded assets
        run: mise run cli:test
