name: CI

# CI runs on pull requests only. main changes only by fast-forwarding to a
# head that already passed here (fast-forward.yml), so it never reruns there.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its unfinished run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request touching only the editor, docs or Markdown cannot change
  # what rust, browser and bench check, so they report success without
  # building. Android and embedded build the editor and always run. The
  # steps are skipped rather than the jobs, because a skipped matrix job never
  # reports the expanded check names that the green ruleset requires. Rust
  # tests read web/src/fields, so those files still count as Rust.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - name: Classify changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          rust=true
          if [ -n "$PR" ] && files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only) && [ -n "$files" ] \
            && ! printf '%s\n' "$files" | grep -qvE '^(web/|docs/)|\.md$' \
            && ! printf '%s\n' "$files" | grep -q '^web/src/fields/'; then
            rust=false
          fi
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - name: Checkout
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: needs.changes.outputs.rust == 'true'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        if: needs.changes.outputs.rust == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Format and Clippy
        if: needs.changes.outputs.rust == 'true'
        run: ts-lint

      - name: Test
        if: needs.changes.outputs.rust == 'true'
        run: ts-test

  browser:
    name: browser wasm build
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - name: Checkout
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: needs.changes.outputs.rust == 'true'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        if: needs.changes.outputs.rust == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Clippy for the browser demo
        if: needs.changes.outputs.rust == 'true'
        run: ts-demo-lint

      - name: Browser tests for the demo engine
        if: needs.changes.outputs.rust == 'true'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" ts-demo-test

  bench:
    name: backend correctness and scaling
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - name: Checkout
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        if: needs.changes.outputs.rust == 'true'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        if: needs.changes.outputs.rust == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: nix profile add nixpkgs#devenv

      # Absolute budgets are for named devices; shared runners report them
      # but gate only on correctness and the no-per-row-work checks.
      - name: Run 50k correctness and scaling
        if: needs.changes.outputs.rust == 'true'
        run: ts-bench --root "${{ runner.temp }}/tessera-bench" --sizes 50000 --fail-on scaling

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Typecheck and build
        run: ts-web-build

  # The rules' own tests, the prose in docs, skills and UI copy, and the
  # messages of the pull request's commits, with the devenv shell's Vale.
  prose:
    name: prose
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Rule tests
        run: ts-docs-test

      - name: Prose
        run: ts-docs-lint

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: ts-commit-lint "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  android:
    name: android app
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      # Builds the pages first: the app's Tauri context embeds them. devenv's
      # android profile supplies the SDK and NDK.
      - name: Clippy for Android
        run: ts-android-lint

  embedded:
    name: embedded release assets
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Build web
        run: ts-web-build

      - name: Build embedded binary
        run: cargo build --locked -p tessera-cli --features embed-web

      - name: Clippy with embedded assets
        run: ts-cli-lint

      - name: Test embedded assets
        run: ts-cli-test
