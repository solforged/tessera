name: Demo

# Builds the in-browser demo (tessera-core as wasm over OPFS) and deploys it
# to the Vercel project behind tessera.solforged.io. Vercel's build image has
# no Rust toolchain, so the build runs here and Vercel receives prebuilt output.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      - name: Build demo
        if: env.VERCEL_TOKEN == ''
        run: mise run demo:build

      - name: Build and deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          mise run deps
          mise run demo:wasm
          bunx vercel@62.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          bunx vercel@62.5.0 build --prod --token="$VERCEL_TOKEN"
          bunx vercel@62.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
