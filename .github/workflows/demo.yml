name: Demo

# Builds the in-browser demo (tessera-core as wasm over OPFS) and deploys it
# to the Vercel project behind tessera.solforged.io. Vercel's build image has
# no Rust toolchain, so the build runs here and Vercel receives prebuilt output.
# Landing a pull request dispatches a deploy of the commit main moved to
# (fast-forward.yml), after CI passed on that commit. A manual dispatch
# publishes a chosen commit, which is how a bad deploy is rolled back. A
# failed deploy opens or updates one issue labelled demo-deploy, and the next
# good deploy closes it, so failures do not repeat as separate notifications.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to deploy. Defaults to the selected ref.
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: demo
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.1

      - name: Build demo
        if: env.VERCEL_TOKEN == ''
        run: mise run demo:build

      - name: Build and deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          mise run deps
          mise run demo:wasm
          bunx vercel@62.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          bunx vercel@62.5.0 build --prod --token="$VERCEL_TOKEN"
          bunx vercel@62.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          # The deployment's own *.vercel.app URL sits behind Vercel
          # Authentication and redirects to a login page, so the check runs
          # against the public alias and waits for this build's entry script.
          entry=$(grep -Eo '/assets/demo-[A-Za-z0-9_-]+\.js' web/dist-demo/demo.html)
          test -n "$entry"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS https://tessera.solforged.io | grep -qF "$entry"; then
              exit 0
            fi
            sleep 10
          done
          echo "tessera.solforged.io did not serve $entry" >&2
          exit 1

      - name: Report the failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          issue=$(gh issue list --repo "$REPO" --label demo-deploy --state open --json number --jq '.[0].number // empty')
          body="Deploying $COMMIT failed: $RUN"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label demo-deploy --title "Demo deploy is failing" --body "$body"
          fi

      - name: Close the deploy failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          for issue in $(gh issue list --repo "$REPO" --label demo-deploy --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --repo "$REPO" --comment "Deployed $COMMIT."
          done
