name: Fast-forward

# Lands a pull request by moving main to its head commit, so the commits stay
# exactly as written and signed and main stays linear without merge or squash
# commits. A pull request lands once it carries the fast-forward label, is not
# a draft, comes from a branch of this repository, sits on main's tip and has a
# green CI run on its head. The reviewed ruleset (pull requests only) lets
# just deploy keys bypass it, and this workflow pushes with the write deploy
# key in the FAST_FORWARD_KEY secret; the green ruleset still checks the
# signatures and the required checks on the commit main moves to.
#
# Nothing else runs on main: CI already passed on this exact commit, and this
# workflow dispatches the demo deploy itself.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: fast-forward
  cancel-in-progress: false

jobs:
  land:
    if: >-
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'fast-forward')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # The job checks out no pull request code: it reads the API, fetches the
      # head commit's objects and pushes that commit to main.
      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.FAST_FORWARD_KEY }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '
            [.[] | select(.state == "open" and .draft == false and .base.ref == "main"
              and .head.sha == env.SHA and .head.repo.full_name == env.REPO
              and any(.labels[]; .name == "fast-forward"))][0] // empty')
          if [ -z "$pr" ]; then
            echo "No open, labelled pull request from this repository has $SHA as its head."
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          branch=$(jq -r .head.ref <<<"$pr")

          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=pull_request&status=success" --jq .total_count)
          if [ "$green" -eq 0 ]; then
            echo "CI has not passed on $SHA yet; the CI run's completion lands it."
            exit 0
          fi

          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          case $status in
            ahead) ;;
            identical) echo "main is already at $SHA."; exit 0 ;;
            *)
              gh pr comment "$number" --repo "$REPO" --body "main moved past this branch's base, so it cannot fast-forward. Rebase onto main and push; it lands once CI passes on the new head."
              exit 0 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/fast_forward
          chmod 600 ~/.ssh/fast_forward
          git init -q land && cd land
          git fetch -q --filter=blob:none "https://github.com/$REPO.git" "$SHA"
          # A plain push refuses anything but a fast-forward of main.
          GIT_SSH_COMMAND="ssh -i ~/.ssh/fast_forward -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push -q "git@github.com:$REPO.git" "$SHA:refs/heads/main"
          cd ..
          rm -f ~/.ssh/fast_forward
          echo "Moved main to $SHA for #$number."

          # GitHub marks the pull request merged once it sees its head on
          # main. Deleting the branch before that would close it unmerged.
          for _ in $(seq 1 30); do
            state=$(gh api "repos/$REPO/pulls/$number" --jq 'if .merged then "merged" else .state end')
            [ "$state" = merged ] && break
            sleep 2
          done
          if [ "$state" = merged ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" || true
          else
            echo "::warning::#$number is $state after main moved; left $branch in place."
          fi

          gh workflow run demo.yml --repo "$REPO" --ref main -f ref="$SHA"
