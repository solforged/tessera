name: Release

# A v* tag publishes the Linux command line, the macOS app with its command
# line, the signed Android APK, latest.json and SHA256SUMS. The tag must match
# the workspace version, and CHANGELOG.md must have a finished section for it.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: release (macOS app)
    # Creates the release, so it is never the latest one without latest.json.
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        run: test "$TAG" = "v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Write release notes
        run: scripts/release/body "$TAG" > "$RUNNER_TEMP/notes.md"


      - name: Build app
        shell: devenv shell -- bash -e {0}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          TESSERA_BUILD="$(git rev-parse --short HEAD)" ts-desktop-build --bundles app,dmg

      - name: Package release
        run: |
          version="${TAG#v}"
          bundle=target/release/bundle
          mkdir dist
          tar -czf "dist/tessera-${TAG}-aarch64-apple-darwin.tar.gz" -C target/release tessera
          cp "$bundle/dmg/Tessera_${version}_aarch64.dmg" dist/
          archive="Tessera_${version}_aarch64.app.tar.gz"
          cp "$bundle/macos/Tessera.app.tar.gz" "dist/$archive"
          cp "$bundle/macos/Tessera.app.tar.gz.sig" "dist/$archive.sig"
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "dist/$archive.sig")" \
            --arg url "https://github.com/${REPOSITORY}/releases/download/${TAG}/${archive}" \
            '{version: $version, notes: "Tessera \($version)", pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > dist/latest.json

      - name: Upload release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          fail_on_unmatched_files: true

  linux:
    name: release (x86_64-unknown-linux-gnu)
    needs: macos
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Build release
        shell: devenv shell -- bash -e {0}
        run: TESSERA_BUILD="$(git rev-parse --short HEAD)" ts-cli-build --target "$TARGET"

      - name: Package binary
        run: tar -czf "tessera-${TAG}-${TARGET}.tar.gz" -C "target/${TARGET}/release" tessera

      - name: Upload release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: tessera-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          fail_on_unmatched_files: true

  android:
    name: release (Android app)
    needs: macos
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      # devenv's android profile supplies the JDK, SDK and NDK.
      - name: Build APK
        shell: devenv shell -- bash -e {0}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          TESSERA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE"
          export TESSERA_ANDROID_KEYSTORE="$RUNNER_TEMP/tessera-release.jks"
          base64 -d <<<"$ANDROID_KEYSTORE" > "$TESSERA_ANDROID_KEYSTORE"
          ts-android-build --target aarch64 --apk
          cp crates/tessera-mobile/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "Tessera_${TAG#v}_aarch64.apk"

      - name: Upload release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Tessera_*_aarch64.apk
          fail_on_unmatched_files: true

  complete:
    name: release (checksums)
    needs: [macos, linux, android]
    if: always() && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ needs.macos.result }}
          LINUX: ${{ needs.linux.result }}
          ANDROID: ${{ needs.android.result }}
        run: scripts/release/finish "${{ github.ref_name }}"
