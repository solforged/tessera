# Prose checks; `mise run docs:lint` runs them with --no-global, so the result
# does not depend on the machine's own Vale configuration, and
# `mise run docs:test` runs the rules' own tests.
#
# Voice is the shared house style (.vale/styles/Voice/Brief.md), copied from
# the system checkout by `mise run docs:style`. Tessera holds the project's
# rules and word lists. Errors fail the check; warnings are advisory.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tessera
# The defaults (tt, code, kbd, samp), plus a skill's `name:` front matter,
# which is an identifier rather than prose.
IgnoredScopes = tt, code, kbd, samp, text.frontmatter.name

[*.md]
BasedOnStyles = Vale, Voice, Tessera
# Tessera.Spelling and Tessera.SpellingCompound are the Voice rules with the
# project's word list.
Vale.Spelling = NO
Voice.Spelling = NO
Voice.SpellingCompound = NO
# Tessera conventions held as errors.
Voice.Dashes = error
Voice.Filler = error
Voice.Inflated = error
Voice.WeakVerbs = error
Voice.Hedging = error
# The README word budget applies to READMEs alone (below).
Voice.ReadmeLength = NO

[{README.md,**/README.md}]
Voice.ReadmeLength = YES

# Release notes are one long list item per change.
[CHANGELOG.md]
Tessera.ParagraphLength = NO
Voice.ChangeNarration = NO

# UI copy: the visible text in the editor's components (config/views/UiCopy.yml).
# Labels are short, so the word-level and interface-text rules apply.
[web/src/**/*.tsx]
View = UiCopy
BasedOnStyles = Vale
Vale.Spelling = NO
# A label and a title on neighboring lines often say the same word.
Vale.Repetition = NO
Tessera.Spelling = YES
Tessera.SpellingCompound = YES
Voice.American = YES
Voice.Filler = error
Voice.Inflated = error
Voice.Tics = YES
Voice.Dashes = error
# Interface text labels and instructs; it does not narrate (Brief.md).
Voice.UiGuarantee = YES
Voice.UiNarration = YES
Voice.UiCadence = YES
Voice.UiLength = YES
Voice.UiSemicolon = YES

# Commit messages use the shared length and layout checks, Tessera's
# dictionary, and Tessera's plain imperative subjects in place of the shared
# type(scope) header and past tense. A body may be prose or bullets.
[COMMIT_EDITMSG]
View = Commit
BasedOnStyles = Vale
Vale.Spelling = NO
Tessera.Spelling = YES
Tessera.SpellingCompound = YES
Tessera.CommitSubject = YES
Tessera.CommitImperative = YES
Voice.American = YES
Voice.CommitHeaderLength = YES
Voice.CommitHeaderPeriod = YES
Voice.CommitGap = YES
Voice.CommitBodyLength = YES
Voice.CommitBulletCount = YES
Voice.CommitBulletPeriod = YES
