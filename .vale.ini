# Prose checks; `ts-docs-lint` runs them with --no-global, so the result
# does not depend on the machine's own Vale configuration, and
# `ts-docs-test` runs the rules' own tests.
#
# Voice is the shared house style (.vale/styles/Voice/Brief.md), copied from
# the system checkout by `ts-docs-style`. Tessera holds the project's
# rules and word lists. Errors fail the check; warnings are advisory.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tessera
# The defaults (tt, code, kbd, samp), plus a skill's `name:` front matter,
# which is an identifier rather than prose.
IgnoredScopes = tt, code, kbd, samp, text.frontmatter.name

[*.md]
BasedOnStyles = Vale, Voice, Tessera
# Tessera.Spelling and Tessera.SpellingCompound are the Voice rules with the
# project's word list.
Vale.Spelling = NO
Voice.Spelling = NO
Voice.SpellingCompound = NO
# Tessera conventions held as errors.
Voice.Dashes = error
Voice.Filler = error
Voice.Inflated = error
Voice.WeakVerbs = error
Voice.Hedging = error

# Release notes are one long list item per change.
[CHANGELOG.md]
Tessera.ParagraphLength = NO

# UI copy: the visible text in the editor's components (config/views/UiCopy.yml).
# Labels are short, so only the word-level rules apply.
[web/src/**/*.tsx]
View = UiCopy
BasedOnStyles = Vale
Vale.Spelling = NO
Tessera.Spelling = YES
Tessera.SpellingCompound = YES
Voice.American = YES
Voice.Filler = error
Voice.Inflated = error
Voice.Tics = YES
Voice.Dashes = error

# Commit messages use the shared structure checks and Tessera's dictionary.
[COMMIT_EDITMSG]
View = Commit
BasedOnStyles = Vale
Vale.Spelling = NO
Tessera.Spelling = YES
Tessera.SpellingCompound = YES
Voice.American = YES
Voice.CommitHeader = YES
Voice.CommitHeaderLength = YES
Voice.CommitPastTense = YES
Voice.CommitHeaderPeriod = YES
Voice.CommitGap = YES
Voice.CommitBodyLength = YES
Voice.CommitBodyStructure = YES
Voice.CommitBulletCount = YES
Voice.CommitBulletPeriod = YES
