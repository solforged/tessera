extends: capitalization
message: "Write '%s' in sentence case."
level: error
scope: heading
match: $sentence
exceptions:
  - Tessera
  - Android
  - macOS
  - iOS
  - Vim
  - MCP
  - EPUB
  - SQLite
  - React
  - Solid
  - ProseMirror
  - CodeMirror
  - WASM
  - CLI
  - Orrery
  - Fold
  - UI
  - API
  - CI
  - iPhone
  - APKs
  - USB
  - QA
  - UX
  - Chrome for Testing

tests:
  - name: reports title-case prose
    input: |
      # Setting Up a Workshop
    contains: Tessera.Headings
  - name: accepts sentence case and proper names
    input: |
      # Setting up a Tessera workshop

      ## API checks on iPhone
    want: ''
