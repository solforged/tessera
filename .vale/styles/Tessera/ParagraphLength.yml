# Long paragraphs hide rules. Split them, or turn parallel cases into a
# list or a table. Applies to paragraphs, list items and table cells.
extends: occurrence
message: "Paragraph runs past 150 words; split it, or use a list or a table."
level: error
scope:
  - paragraph
  - list
  - table.cell
max: 150
token: \b(\w+)\b

tests:
  - name: reports a 151-word paragraph
    input: |
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word
    contains: Tessera.ParagraphLength
  - name: accepts a 150-word paragraph
    input: |
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
      word word word word word word word word word word word word word word word word word word word word word word word word word
    want: ''
