# A lexical check, not a parser: regular -ed forms and listed irregulars.
extends: existence
message: 'Start the summary with a lowercase past-tense verb (for example, added, fixed, or built).'
level: error
scope: subject
nonword: true
raw:
  - '\A[a-z]+(?:\([a-z0-9_-]+(?:/[a-z0-9_-]+)?\))?: (?!(?:[a-z]+ed|awoke|became|began|bent|bet|bit|bled|blew|bore|bought|broke|brought|built|bound|burnt|burst|caught|chose|clung|cost|crept|cut|dealt|did|drew|drank|drove|dug|fed|fell|felt|fit|fled|flew|forbade|forgot|forgave|found|froze|gave|got|grew|ground|had|heard|held|hid|hit|hung|hurt|kept|knew|laid|lay|led|left|lent|let|lit|lost|made|meant|met|overcame|overdid|overrode|oversaw|overtook|paid|put|ran|read|rebuilt|redid|remade|reran|reset|retold|rewrote|rode|rose|said|sang|sank|sat|saw|sent|set|shone|shook|shot|showed|shrank|shut|slept|slid|sold|sought|spat|sped|spent|spilt|split|spoke|spread|sprang|spun|stank|stood|stole|struck|stuck|stung|sung|sunk|swam|swept|swore|swung|taught|thought|threw|told|took|tore|trod|undid|understood|upheld|upset|woke|wore|wept|went|wet|withdrew|withheld|withstood|won|wound|wove|wrote)\b)[^\s]+'
tests:
  - name: rejects present tense
    format: COMMIT_EDITMSG
    view: Commit
    input: "fix: repair the parser"
    contains: Voice.CommitPastTense
  - name: rejects an uppercase verb
    format: COMMIT_EDITMSG
    view: Commit
    input: "fix: Fixed the parser"
    contains: Voice.CommitPastTense
  - name: accepts a regular past tense
    format: COMMIT_EDITMSG
    view: Commit
    input: "fix: fixed the parser"
    want: ''
  - name: accepts made
    format: COMMIT_EDITMSG
    view: Commit
    input: "fix: made the parser"
    want: ''
  - name: accepts kept
