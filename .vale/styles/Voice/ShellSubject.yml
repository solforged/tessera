extends: existence
message: "'%s' narrates the argument instead of making it; start with the claim or the person making it."
level: warning
ignorecase: false
nonword: true
tokens:
  - '(?:^|(?<=[.!?]\s))(?:The|This|That) (?:question|disagreement|dispute|debate|distinction|comparison|mechanism|tension|objection) (?:asks|turns on|centers on|hinges on|rests on|lies in|is whether|is how|is what)\b'

tests:
  - name: reports a narrating subject
    input: |
      The question turns on who owns the lock.
    want: |
      1:1:Voice.ShellSubject:'The question turns on' narrates the argument instead of making it; start with the claim or the person making it.
  - name: leaves the claim alone
    input: |
      The writer owns the lock.
    want: ''
