[workspace]
resolver = "3"
members = ["crates/tessera-core", "crates/tessera-ingest", "crates/tessera-api", "crates/tessera-service", "crates/tessera-web", "crates/tessera-cli", "crates/tessera-desktop", "crates/tessera-mobile", "crates/tessera-bench"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/solforged/tessera"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
tessera-ingest = { path = "crates/tessera-ingest" }
tessera-api = { path = "crates/tessera-api" }
tessera-service = { path = "crates/tessera-service" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
cfg_aliases = "0.2"
parking_lot = "0.12"
percent-encoding = "2"
roxmltree = "0.21"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures-util = { version = "0.3", features = ["sink"] }
imagesize = "0.15"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
# Writes the TypeScript declarations of the wire types; see `mise run wire`.
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
