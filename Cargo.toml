[workspace]
resolver = "3"
members = ["crates/tessera-core", "crates/tessera-ingest", "crates/tessera-service", "crates/tessera-web", "crates/tessera-cli", "crates/tessera-desktop", "crates/tessera-android", "crates/tessera-bench"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/solforged/tessera"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
tessera-ingest = { path = "crates/tessera-ingest" }
tessera-service = { path = "crates/tessera-service" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures-util = { version = "0.3", features = ["sink"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
