[workspace]
resolver = "3"
members = ["crates/tessera-core", "crates/tessera-service", "crates/tessera-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/solforged/tessera"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
tessera-service = { path = "crates/tessera-service" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
ulid = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
