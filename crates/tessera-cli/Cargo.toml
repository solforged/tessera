[package]
name = "tessera-cli"
description = "Command line for Tessera notebooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tessera"
path = "src/main.rs"

[features]
embed-web = ["tessera-service/embed-web"]

[dependencies]
tessera-core.workspace = true
tessera-service.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
reqwest.workspace = true
percent-encoding = "2"
tracing-subscriber.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
