[package]
name = "tessera-core"
description = "Domain model, migrations and transactional operations for Tessera notebooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# tzdb-concatenated reads Android's tzdata file; other platforms ignore it.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ulid.workspace = true
tempfile.workspace = true
deunicode = "1"
tracing.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
jiff = { version = "0.2", default-features = false, features = ["js"] }

[lints]
workspace = true
