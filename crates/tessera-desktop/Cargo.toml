[package]
name = "tessera-desktop"
description = "macOS app that runs the Tessera service and keeps it up to date"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-updater = "2.13.2"
tauri-plugin-window-state = "2.5.0"
jiff = { version = "0.2", default-features = false, features = ["std"] }
parking_lot = "0.12"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
