<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessera</title>
<style>
  :root { color-scheme: dark light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #0a0d13; color: #e6e1d6;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  /* The shell's own colours (web/src/tokens.css --shell, --text), so the
     splash hands over to the app without a change of tone. */
  @media (prefers-color-scheme: light) { body { background: #ebe5d8; color: #1f1b15; } }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 .25rem; }
  p { margin: 0; opacity: .7; }
  pre {
    display: none; margin: 1.25rem 0 0; padding: .75rem; max-height: 14rem; overflow: auto;
    text-align: left; white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace;
    background: #151b26; border: 1px solid #232c3b; border-radius: 6px;
    -webkit-user-select: text; user-select: text;
  }
  .actions { display: none; gap: .5rem; justify-content: center; margin-top: 1rem; }
  button {
    font: inherit; padding: .3rem .9rem; border-radius: 6px; cursor: pointer;
    background: transparent; color: inherit; border: 1px solid #48546b;
  }
  button.primary { background: #d8aa55; border-color: #d8aa55; color: #14110b; }
  body.failed pre { display: block; }
  body.failed .actions { display: flex; }
  @media (prefers-color-scheme: light) {
    pre { background: #fffdf8; border-color: #ddd5c4; }
    button { border-color: #b3a890; }
    button.primary { background: #93650f; border-color: #93650f; color: #fffdf8; }
  }
</style>
</head>
<!-- The window has no native title bar, so the whole splash moves it; the log stays selectable. -->
<body data-tauri-drag-region="deep">
<main>
  <h1 id="status">Starting Tessera…</h1>
  <p id="note"></p>
  <pre id="detail" data-tauri-drag-region="false"></pre>
  <div class="actions">
    <button class="primary" id="retry">Try again</button>
    <button id="log">Show log</button>
  </div>
</main>
<script>
  // The shell calls this through `eval`; the page never reaches the notebook.
  window.showStatus = (status, note, detail) => {
    document.getElementById('status').textContent = status;
    document.getElementById('note').textContent = note || '';
    document.getElementById('detail').textContent = detail || '';
    document.body.classList.toggle('failed', Boolean(detail));
  };
  const invoke = command => window.__TAURI_INTERNALS__.invoke(command);
  document.getElementById('retry').addEventListener('click', () => invoke('retry'));
  document.getElementById('log').addEventListener('click', () => invoke('show_log'));
</script>
</body>
</html>
