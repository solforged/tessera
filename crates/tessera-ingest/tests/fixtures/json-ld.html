<h1>Knots that hold</h1>
<p class="post-author">Small Craft Press</p>
<p>A bowline holds under load and still unties after a wet week at anchor, which is why it is the first knot most sailors learn.</p>
<p>The rolling hitch is the knot to reach for when a line must hold against a pull along a spar or another rope.</p>
