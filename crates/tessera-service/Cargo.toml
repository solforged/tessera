[package]
name = "tessera-service"
description = "Loopback HTTP service that owns a Tessera notebook"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
embed-web = ["dep:include_dir"]

[dependencies]
tessera-api.workspace = true
tessera-core.workspace = true
anyhow.workspace = true
axum.workspace = true
base64 = "0.23"
dirs.workspace = true
futures-util.workspace = true
getrandom = "0.4"
include_dir = { version = "0.7", optional = true }
jiff = { version = "0.2", default-features = false, features = ["std"] }
parking_lot.workspace = true
percent-encoding.workspace = true
qrcodegen = "1.8"
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing.workspace = true
ts-rs.workspace = true
ulid.workspace = true
webpki-roots = "1"

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
