[package]
name = "tessera-service"
description = "Loopback HTTP service that owns a Tessera workshop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["hub"]
hub = ["dep:qrcodegen", "dep:tokio-util", "tokio/process"]
embed-web = ["hub", "dep:include_dir"]

[dependencies]
tessera-api.workspace = true
tessera-core.workspace = true
anyhow.workspace = true
axum.workspace = true
base64 = "0.23"
dirs.workspace = true
futures-util.workspace = true
getrandom = "0.4"
include_dir = { version = "0.7", optional = true }
jiff = { version = "0.2", default-features = false, features = ["std"] }
parking_lot.workspace = true
percent-encoding.workspace = true
qrcodegen = { version = "1.8", optional = true }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"], optional = true }
tracing.workspace = true
ts-rs.workspace = true
ulid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
