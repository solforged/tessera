[package]
name = "tessera-service"
description = "Loopback HTTP service that owns a Tessera notebook"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
embed-web = ["dep:include_dir"]

[dependencies]
tessera-core.workspace = true
tessera-ingest.workspace = true
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
parking_lot = "0.12"
tracing.workspace = true
roxmltree = "0.21"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
anyhow.workspace = true
axum.workspace = true
dirs.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["process"] }
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1"
thiserror.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
include_dir = { version = "0.7", optional = true }
base64 = "0.22"
getrandom = "0.4"
qrcodegen = "1.8"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path", "original-uri"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
tower.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
ulid.workspace = true

[lints]
workspace = true
