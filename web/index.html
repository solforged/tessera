<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e121a" />
    <title>Tessera</title>
    <!-- The oculus from the wordmark, in each theme's gilt. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cstyle%3E%2A%7Bcolor:%23d8aa55%7D%40media%28prefers-color-scheme:light%29%7B%2A%7Bcolor:%2380560a%7D%7D%3C/style%3E%3Ccircle cx='8' cy='8' r='3' fill='currentColor'/%3E%3Ccircle cx='8' cy='8' r='6.6' fill='none' stroke='currentColor' stroke-width='1.8'/%3E%3C/svg%3E" />
    <!-- The device's theme before any stylesheet loads: no flash. theme-boot.js (loaded first) marks a stored Light or Dark choice on the root; otherwise the system theme paints. The entry then applies the choice for good. -->
    <style>html { color-scheme: dark; background: #0e121a; color: #e6e1d6; } @media (prefers-color-scheme: light) { html:not([data-theme]) { color-scheme: light; background: #f8f5ee; color: #1f1b15; } } html[data-theme="light"] { color-scheme: light; background: #f8f5ee; color: #1f1b15; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
